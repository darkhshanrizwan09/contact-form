<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contact-container">
        <div class="contact-form">
            <p class="small-heading">GET IN TOUCH</p>
            <h1>let's Start A <br> Conversation</h1>
            <p class="description">Have a project in mind or simply want to say hello? Fill out the form and we'll get back to you soon.</p>
          <!--  -->

            <form>
                <div class="name-row">

                    <div class="input-box">
                        <label>FIRST NAME</label>
                        <input type="text" placeholder="Your first name">
                    </div>

                    <div class="input-box">
                        <label>LAST NAME</label>
                        <input type="text" placeholder="Your last name">
                    </div>

                </div>
                 <div class="input-box">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" placeholder="you@gmail.com">
                </div>
                 <div class="input-box">
                    <label>SUBJECT</label>
                    <input type="text" placeholder="How can we help?">
                </div>
                 <div class="input-box">
                    <label>YOUR MESSAGE</label>
                    <textarea placeholder="Tell us a little about your project..."></textarea>
                </div>

                <button type="submit">SEND MESSAGE</button>

            </form>
        </div>
        <div class="contact-image">
             <div class="image-box">

                <p>LET'S CREATE</p>

                <h2>
                    Great ideas<br>
                    deserve to<br>
                    be heard.
                </h2>

                <p class="end">
                    Whether it's a new project, collaboration,
                    or just an idea, we'd love to hear from you.
                </p>

            </div>
        </div>
    </div>
    
</body>
</html>
